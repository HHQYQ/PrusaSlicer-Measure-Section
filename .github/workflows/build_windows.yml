name: Windows installer — three-point circle

on:
  push:
    branches:
      - codex/prusaslicer-2.9.7-three-point-circle
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: prusa-three-point-windows
  cancel-in-progress: true

jobs:
  section-shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shader compilation and compound clipping on Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools libegl1-mesa-dev libgl1-mesa-dri
          python -m pip install moderngl==5.12.0
          python build-utils/test_section_shaders.py

  installer:
    needs: section-shaders
    runs-on: windows-2022
    timeout-minutes: 175
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Read project name and version
        run: |
          $branding = Get-Content -Raw -LiteralPath 'build-utils/project-branding.iss'
          if ($branding -notmatch '(?m)^#define ProjectName "([^"\r\n]+)"\r?$') { throw 'Missing project name' }
          "PROJECT_NAME=$($Matches[1])" >> $env:GITHUB_ENV
          if ($branding -notmatch '(?m)^#define ProjectVersion "(\d+\.\d+\.\d+\.\d+)"\r?$') { throw 'Missing project version' }
          "PROJECT_VERSION=$($Matches[1])" >> $env:GITHUB_ENV

      - name: Restore compiled application files
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: payload
          key: prusa-297-win2022-v143-x64-app-v1-${{ hashFiles('src/**', 'resources/**', 'deps/**', 'bundled_deps/**', 'cmake/**', 'CMakeLists.txt', 'version.inc', 'build-utils/project-branding.iss', 'tests/CMakeLists.txt', 'tests/libslic3r/test_mesh_edge_finish.cpp', 'tests/libslic3r/test_view_transparency.cpp', 'tests/libslic3r/test_measure_references.cpp') }}

      - name: Restore compiled dependencies
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' }}
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps-build/destdir/usr/local
          key: prusa-297-win2022-v143-x64-deps-v1-${{ hashFiles('deps/**', 'cmake/modules/**') }}

      - name: Build PrusaSlicer dependencies
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true' }}
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%I\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cmake -S deps -B deps-build -G "Visual Studio 17 2022" -A x64 -DDEP_DEBUG=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CONFIGURATION_TYPES=Release
          if errorlevel 1 exit /b 1
          cmake --build deps-build --config Release
          if errorlevel 1 exit /b 1

      - name: Save compiled dependencies
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: deps-build/destdir/usr/local
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build PrusaSlicer 2.9.7
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' }}
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%I\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 -DCMAKE_CONFIGURATION_TYPES=Release "-DCMAKE_PREFIX_PATH=%CD%\deps-build\destdir\usr\local" "-DCMAKE_INSTALL_PREFIX=%CD%\payload" -DSLIC3R_BUILD_TESTS=ON
          if errorlevel 1 exit /b 1
          cmake --build build-win --config Release --parallel 2 --target PrusaSlicer_app_gui PrusaSlicer_app_console PrusaSlicer_app_gcodeviewer OCCTWrapper PrusaSlicerDllsCopy mesh_edge_finish_tests view_transparency_tests measure_reference_tests
          if errorlevel 1 exit /b 1
          ctest --test-dir build-win -C Release -R "^(mesh_edge_finish|view_transparency|measure_reference)_tests$" --output-on-failure --no-tests=error
          if errorlevel 1 exit /b 1

      - name: Compile translations and stage application files
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' }}
        run: |
          $env:Path = "C:\msys64\usr\bin;$env:Path"
          if (!(Get-Command msgfmt.exe -ErrorAction SilentlyContinue)) {
            & 'C:\msys64\usr\bin\pacman.exe' -S --needed --noconfirm gettext
            if ($LASTEXITCODE -ne 0) { throw 'Unable to install GNU gettext.' }
          }
          cmake --build build-win --config Release --target gettext_po_to_mo
          if ($LASTEXITCODE -ne 0) { throw 'Translation compilation failed.' }
          cmake --install build-win --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Application staging failed.' }
          $buildOutput = 'build-win\src\Release'
          Copy-Item "$buildOutput\*.dll" -Destination payload
          Copy-Item "$buildOutput\prusa-gcodeviewer.exe" -Destination payload
          Copy-Item LICENSE -Destination 'payload\LICENSE.txt'

      - name: Save compiled application files
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: payload
          key: ${{ steps.app-cache.outputs.cache-primary-key }}

      - name: Stage installer metadata and Visual C++ runtime
        run: |
          @(
            "$env:PROJECT_NAME $env:PROJECT_VERSION"
            'Based on PrusaSlicer 2.9.7. This is an independent build.'
            "Source and build scripts: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA"
            'License: GNU AGPL version 3 or later, see LICENSE.txt.'
          ) | Set-Content -Encoding UTF8 'payload\Source.txt'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $redistRoot = Join-Path $vs 'VC\Redist\MSVC'
          $redist = Join-Path $redistRoot 'v143\x64\Microsoft.VC143.CRT'
          if (!(Test-Path -LiteralPath $redist -PathType Container)) {
            $redist = Get-ChildItem -LiteralPath $redistRoot -Directory |
              Where-Object { $_.Name -match '^\d+(?:\.\d+){1,3}$' } |
              Sort-Object { [version]$_.Name } -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64\Microsoft.VC143.CRT' } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Container } |
              Select-Object -First 1
          }
          if (!$redist) { throw 'Microsoft VC143 runtime files were not found.' }
          Copy-Item "$redist\*.dll" -Destination payload
          foreach ($path in @('prusa-slicer.exe', 'prusa-slicer-console.exe', 'PrusaSlicer.dll',
              'WebView2Loader.dll', 'libgmp-10.dll', 'libmpfr-4.dll',
              'resources\localization\zh_CN\PrusaSlicer.mo')) {
            if (!(Test-Path -LiteralPath "payload\$path")) { throw "Missing installer file: $path" }
          }

      - name: Package for Windows x64
        id: package
        run: |
          $env:PRUSA_INSTALL_PAYLOAD = (Resolve-Path payload).Path
          $env:PRUSA_INSTALL_OUTPUT = Join-Path $PWD 'installer-output'
          New-Item -ItemType Directory -Path $env:PRUSA_INSTALL_OUTPUT -Force | Out-Null
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (!$iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc 'build-utils\windows-three-point-circle.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          $packages = @(Get-ChildItem -LiteralPath $env:PRUSA_INSTALL_OUTPUT -Filter '*-Setup.exe' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one setup executable.' }
          $setup = $packages[0]
          $version = $setup.VersionInfo.FileVersionRaw.ToString()
          if ($setup.Name -ne "PrusaSlicer-$version-Three-Point-Circle-x64-Setup.exe" -or
              $version -ne $env:PROJECT_VERSION -or
              $setup.VersionInfo.ProductVersionRaw.ToString() -ne $env:PROJECT_VERSION -or
              $setup.VersionInfo.ProductName.TrimEnd() -ne $env:PROJECT_NAME) {
            throw 'Setup filename or branding metadata is incorrect.'
          }
          "setup=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Find the previous successful installer for the upgrade test
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:PROJECT_VERSION -eq '2.9.7.11') {
            $previousDir = Join-Path $env:RUNNER_TEMP 'PrusaThreePointPrevious'
            $asset = 'PrusaSlicer-2.9.7.10-Three-Point-Circle-x64-Setup.exe'
            gh release download v2.9.7.10-three-point-circle --repo $env:GITHUB_REPOSITORY --pattern $asset --dir $previousDir
            if ($LASTEXITCODE -ne 0) { throw 'The 2.9.7.10 upgrade baseline is required.' }
            $previous = Join-Path $previousDir $asset
            if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash -ne '60fd1c5fb26ef2ebe7413bbbaeb48ad4def879794dada8da9f806e47a17eb055') {
              throw 'The 2.9.7.10 installer does not match the recorded checksum.'
            }
            "setup=$previous" >> $env:GITHUB_OUTPUT
            return
          }
          if ($env:PROJECT_VERSION -eq '2.9.7.12') {
            $previousDir = Join-Path $env:RUNNER_TEMP 'PrusaThreePointPrevious'
            $asset = 'PrusaSlicer-2.9.7.11-Three-Point-Circle-x64-Setup.exe'
            gh release download v2.9.7.11-three-point-circle --repo $env:GITHUB_REPOSITORY --pattern $asset --dir $previousDir
            if ($LASTEXITCODE -ne 0) { throw 'The 2.9.7.11 upgrade baseline is required.' }
            $previous = Join-Path $previousDir $asset
            if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash -ne '2beaed1b1b74eaab130c43779ae2ea8238de8af9a74b75e99c6b35772d71d545') {
              throw 'The 2.9.7.11 installer does not match the recorded checksum.'
            }
            "setup=$previous" >> $env:GITHUB_OUTPUT
            return
          }
          $runId = gh run list --workflow build_windows.yml --branch $env:GITHUB_REF_NAME `
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty'
          if ($LASTEXITCODE -ne 0 -or !$runId) { return }
          $previousDir = Join-Path $env:RUNNER_TEMP 'PrusaThreePointPrevious'
          gh run download $runId --pattern 'PrusaSlicer-*-Windows-x64' --dir $previousDir
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Previous artifact unavailable. Testing in-place reinstallation.'
            return
          }
          $previous = @(Get-ChildItem -LiteralPath $previousDir -Recurse -Filter '*-Setup.exe' -File)
          if ($previous.Count -eq 1) { "setup=$($previous[0].FullName)" >> $env:GITHUB_OUTPUT }

      - name: Test installation, in-place replacement and application startup
        env:
          SETUP_EXE: ${{ steps.package.outputs.setup }}
          PREVIOUS_SETUP: ${{ steps.previous.outputs.setup }}
        run: |
          $setup = $env:SETUP_EXE
          $installDir = Join-Path $env:RUNNER_TEMP 'PrusaThreePointTest'
          $parameters = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          $baseline = if ($env:PREVIOUS_SETUP) { $env:PREVIOUS_SETUP } else { $setup }
          Write-Host "Initial installer: $(Split-Path $baseline -Leaf)"
          $install = Start-Process -FilePath $baseline -ArgumentList ($parameters + "/DIR=""$installDir""") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exit code: $($install.ExitCode)" }

          $installedExe = Join-Path $installDir 'prusa-slicer.exe'
          $expectedHash = (Get-FileHash -LiteralPath 'payload\prusa-slicer.exe').Hash
          [IO.File]::AppendAllText($installedExe, 'Test marker for file replacement')
          $presetDir = Join-Path $env:APPDATA 'PrusaSlicer\printer'
          New-Item -ItemType Directory -Path $presetDir -Force | Out-Null
          $preset = Join-Path $presetDir 'installer-upgrade-test.ini'
          'Preset retained across installation' | Set-Content -LiteralPath $preset
          $presetHash = (Get-FileHash -LiteralPath $preset).Hash

          $upgrade = Start-Process -FilePath $setup -ArgumentList $parameters -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "In-place installation exit code: $($upgrade.ExitCode)" }
          $uninstallRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $entry = Get-ItemProperty -LiteralPath "$uninstallRoot\{CD88DF34-AB88-423B-870D-4DA3AC903830}_is1"
          $displayName = "$env:PROJECT_NAME $env:PROJECT_VERSION"
          if ($entry.InstallLocation.TrimEnd('\') -ne $installDir -or $entry.DisplayVersion -ne $env:PROJECT_VERSION -or
              $entry.DisplayName -ne $displayName) {
            throw 'The registered directory, name or version is incorrect.'
          }
          $versionInfo = (Get-Item -LiteralPath $installedExe).VersionInfo
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) "$env:PROJECT_NAME\$env:PROJECT_NAME.lnk"
          if ($versionInfo.ProductName -ne $env:PROJECT_NAME -or $versionInfo.FileDescription -ne $displayName -or
              $versionInfo.ProductVersionRaw.ToString() -ne $env:PROJECT_VERSION -or !(Test-Path -LiteralPath $shortcut)) {
            throw 'The installed executable branding or Start menu shortcut is incorrect.'
          }
          if ((Get-FileHash -LiteralPath $installedExe).Hash -ne $expectedHash -or
              (Get-FileHash -LiteralPath $preset).Hash -ne $presetHash) {
            throw 'In-place installation did not replace the application and preserve the preset.'
          }
          if (@(Get-ChildItem -LiteralPath $installDir -Filter 'unins*.dat' -File).Count -ne 1) {
            throw 'The installation did not reuse the existing uninstall log.'
          }

          $installedCli = Join-Path $installDir 'prusa-slicer-console.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'prusa-three-point-help.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'prusa-three-point-stderr.txt'
          $app = Start-Process -FilePath $installedCli -ArgumentList '--help' -Wait -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content -LiteralPath $stdout,$stderr
          if ($app.ExitCode -ne 0 -or !(Select-String -Path $stdout -Pattern '2\.9\.7' -Quiet)) {
            throw "Installed PrusaSlicer smoke test failed. Exit code: $($app.ExitCode)"
          }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $setup -Leaf)" | Set-Content -Encoding ascii 'installer-output\SHA256.txt'
          Get-Content 'installer-output\SHA256.txt'

      - name: Package portable application and matching source
        run: |
          $version = '${{ steps.package.outputs.version }}'
          Compress-Archive -Path 'payload\*' -DestinationPath "installer-output\PrusaSlicer-$version-Portable.zip"
          git archive --format=zip --output="installer-output/PrusaSlicer-$version-Source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
          Get-ChildItem -LiteralPath installer-output -File |
            Where-Object { $_.Extension -in @('.exe', '.zip') } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ascii 'installer-output\SHA256.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-${{ steps.package.outputs.version }}-Three-Point-Circle-Windows-x64
          path: installer-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish tested Windows release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.package.outputs.version }}'
          $tag = "v$version-three-point-circle"
          $assets = @(Get-ChildItem -LiteralPath installer-output -File | ForEach-Object FullName)
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$env:PROJECT_NAME $version" --notes-file "build-utils/release-notes-$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
